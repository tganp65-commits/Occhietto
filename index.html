<style>
:root{--bg1:#5ad1ff;--bg2:#8a6cff;--card:#fff;--tx:#1d2350;--acc:#ff7a1a;--ok:#22b45a;--ko:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#1b3a8a;--bg2:#3b1f7a;--card:#202552;--tx:#f3f4ff}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
.app{max-width:1000px;margin:0 auto;padding:10px;display:grid;gap:10px}
@media(min-width:800px){.app{grid-template-columns:1fr 1fr;align-items:start}.left{order:1}.right{order:2}}
.card{background:var(--card);border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.18);overflow:hidden;position:relative}
.ref{aspect-ratio:1;background:#fff}.ref>div:not(#chip),.ref svg{position:absolute;inset:0;width:100%;height:100%}#chip{width:auto;height:auto;right:auto;bottom:auto;pointer-events:none}
#photoView img{width:100%;height:100%;display:block}
#chip{position:absolute;left:10px;top:10px;z-index:5;background:var(--acc);color:#fff;font-weight:800;padding:6px 14px;border-radius:20px;font-size:clamp(14px,3.6vw,20px);animation:pop .5s}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
#photoView{transition:transform .6s ease;transform-origin:0 0}#ref.small #photoView{transform:scale(.68)}
#o-part{filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1px #000)}
#ref #lineSvg{pointer-events:none;z-index:3}
#ref #secView{display:none;inset:auto;left:46%;top:56%;width:52%;height:auto;aspect-ratio:5/4;background:#fff8ef;border:4px solid #ff7a1a;border-radius:20px;overflow:hidden;z-index:4}
#ref.small #secView{animation:pop .5s}
.ov{display:none}.ov.out{display:block;animation:out .9s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes out{from{transform:translate(var(--dx,0px),var(--dy,0px)) scale(.15);opacity:0}to{transform:none;opacity:1}}
.p{opacity:.22;transition:opacity .5s}.p.on{opacity:1;animation:glow 1s infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 1px #ffe066)}to{filter:drop-shadow(0 0 5px #ffb400)}}
.dash{stroke-dasharray:3 2;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-10}}
.talkrow{display:flex;gap:10px;align-items:flex-end;padding:10px}
.char{flex:0 0 38%;max-width:200px;position:relative;border-radius:22px;overflow:hidden;animation:walk 1.6s ease-in-out infinite;transform-origin:50% 100%}
.char img{width:100%;display:block}.talking .char{animation-duration:.6s}
@keyframes walk{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-5px)}}
.mouth{position:absolute;left:51%;top:60%;width:17%;transform:translateX(-50%)}
.mouth .o{display:none;transform-box:fill-box;transform-origin:center}.talking .mouth .o{display:block;animation:talk .28s ease-in-out infinite alternate}.talking .mouth .s{display:none}
@keyframes talk{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.bubble{flex:1;background:#fff8dc;color:#3a2b00;border:3px solid #ffb400;border-radius:22px;padding:12px 14px;font-size:clamp(16px,4.2vw,21px);line-height:1.35;position:relative;min-height:120px}
.bubble:before{content:"";position:absolute;left:-14px;bottom:26px;border:10px solid transparent;border-right:14px solid #ffb400}
.bubble h3{margin:0 0 4px;color:var(--acc);font-size:1.15em}
.nav{display:flex;gap:8px;padding:0 10px 12px;flex-wrap:wrap}
button{white-space:nowrap;font:inherit;font-weight:800;border:0;border-radius:18px;padding:12px 16px;background:var(--acc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;flex:1;min-width:90px;font-size:clamp(15px,4vw,19px)}
button:active{transform:translateY(3px);box-shadow:none}button.g{background:#6c63ff}button.opt{background:#fff;color:#1d2350;border:3px solid #c9ccf5;text-align:left;width:100%;margin:5px 0;box-shadow:none}
button.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.dots{padding:0 14px 8px;font-size:13px;opacity:.8}.big{font-size:1.5em}.foot{text-align:center;color:#fff;font-size:12px;padding:4px;grid-column:1/-1}

<script>

// ---------- SVG foto (occhio di riferimento) ----------
const O=$("ovs");let h="";
const g=(id,dx,dy,c)=>`<g class="ov" id="${id}" style="--dx:${dx}px;--dy:${dy}px">${c}</g>`;
let lash="";for(let i=0;i<19;i++){const a=(-165+i*8.3)*Math.PI/180,x1=50+40*Math.cos(a),y1=48+40*Math.sin(a),x2=50+51*Math.cos(a-.1),y2=48+51*Math.sin(a-.1);lash+=`<path d="M${x1} ${y1}Q${(x1+x2)/2+2} ${(y1+y2)/2} ${x2} ${y2}" stroke="#2a1a14" stroke-width="1.3" fill="none" stroke-linecap="round"/>`}
h+=g("g-ciglia",0,12,lash);
h+=g("g-palpebre",0,-20,`<path d="M-5 -5H105V30Q50 6 -5 30Z" fill="#f0b48a" stroke="#c4825a" stroke-width="1.2"/><path d="M-5 105H105V70Q50 92 -5 70Z" fill="#f0b48a" stroke="#c4825a" stroke-width="1.2"/>`);
h+=g("g-congiuntiva",0,0,`<circle cx="50" cy="48" r="40" fill="none" stroke="#ff4f7b" stroke-width="5" opacity=".6"/><circle cx="50" cy="48" r="36" fill="none" stroke="#ff9db5" stroke-width="2" class="dash"/>`);
h+=g("g-lacrimale",-14,-10,`<ellipse cx="82" cy="16" rx="10" ry="6" fill="#39b8ff" stroke="#fff" stroke-width="1"/><path d="M80 20Q50 22 14 56" fill="none" stroke="#39b8ff" stroke-width="2.2" class="dash"/><path d="M12 64q-4 6 0 9q4-3 0-9z" fill="#39b8ff"/><path d="M18 68q-3 5 0 7q3-3 0-7z" fill="#39b8ff"/>`);
h+=g("g-tear",0,0,`<circle cx="50" cy="48" r="40" fill="#7fd4ff" opacity=".32" stroke="#7fd4ff" stroke-width="1.2"/><text x="24" y="26" font-size="9">✨</text><text x="66" y="30" font-size="7">✨</text><text x="30" y="70" font-size="8">💧</text><text x="76" y="76" font-size="6">✨</text>`);
h+=g("g-sclerafoto",0,0,`<path fill-rule="evenodd" d="M10 48a40 40 0 1 0 80 0a40 40 0 1 0-80 0ZM41 52a20 20 0 1 0 40 0a20 20 0 1 0-40 0Z" fill="#fff" opacity=".55" stroke="#fff" stroke-width="1.5"/>`);
h+=g("g-cornea",-12,0,`<circle cx="61" cy="52" r="23" fill="#bfeaff" fill-opacity=".25" stroke="#ffe066" stroke-width="2.5" class="dash"/>`);
h+=g("g-iris",0,0,`<circle cx="61" cy="52" r="20" fill="none" stroke="#ffd23f" stroke-width="2.8"/><circle cx="61" cy="52" r="11" fill="none" stroke="#ff4f8b" stroke-width="2.5" class="dash"/>`);
O.innerHTML=h+`<g class="ov" id="o-part" style="--dx:11px;--dy:4px"><g id="o-in" transform="translate(50 48) scale(.46) translate(-130 -120)"></g></g>`;
// ---------- SVG sezione ----------
let s=`<circle class="p" id="s-vitreous" cx="130" cy="120" r="71" fill="#cdeeff"/>
<ellipse class="p" id="s-chamber" cx="43" cy="120" rx="11" ry="47" fill="#7fe0ff"/>
<circle class="p" id="s-sclera" cx="130" cy="120" r="92" fill="none" stroke="#fdfdfd" stroke-width="9"/><circle cx="130" cy="120" r="96.5" fill="none" stroke="#cfd3e6"/>
<circle class="p" id="s-choroid" cx="130" cy="120" r="85" fill="none" stroke="#8b3a2a" stroke-width="6"/>
<circle class="p" id="s-epr" cx="130" cy="120" r="81" fill="none" stroke="#2b1b1b" stroke-width="2.6"/>

<g class="p" id="s-zonula" stroke="#444" stroke-width="1"><path d="M66 100L62 74M66 140L62 166M70 104L66 76M70 136L66 164"/></g>
<g class="p" id="s-ciliary" fill="#e86c8d"><path d="M56 68L72 70L64 82Z"/><path d="M56 172L72 170L64 158Z"/></g>
<ellipse class="p" id="s-lens" cx="66" cy="120" rx="9" ry="22" fill="#ffe9a8" stroke="#e0b84a" stroke-width="1.5"/>

<g class="p" id="s-vessels" fill="none" stroke="#e5252a" stroke-width="1.6"><path d="M205 147Q192 120 168 92M205 147Q198 165 178 186M200 140Q206 108 190 80M203 141Q170 140 150 150"/></g>
<g class="p" id="s-nerve"><path d="M210 148L272 164" stroke="#f1dfa7" stroke-width="15" stroke-linecap="round"/><ellipse cx="207" cy="147" rx="4" ry="9" fill="#fff4c9" stroke="#d9b85c"/></g>`;
$("sec").innerHTML=s;
let ph="";for(let i=0;i<16;i++){const a=(-78+i*3.6)*Math.PI/180,c=i%3?"#fff":"#27c46b";ph+=`<path d="M${130+70*Math.cos(a)} ${120+70*Math.sin(a)}L${130+76*Math.cos(a)} ${120+76*Math.sin(a)}" stroke="${c}" stroke-width="2"/>`}

// ---------- Contenuti ----------
const S=[],G=[];
const A=(grp,v,ids,t,x)=>S.push({grp,v,ids,t,x});
A(0,"f",["g-ciglia"],"CIGLIA","Ciao, io sono Occhietto! Cominciamo con gli annessi, i guardiani del mio occhio. Ciglia! Dall’occhio escono le ciglia: sono i piccoli peli sul bordo delle palpebre. Fermano polvere e piccoli granelli, e mi fanno chiudere l’occhio quando qualcosa si avvicina troppo.");
A(0,"f",["g-palpebre"],"PALPEBRE","Palpebre! Sono la pelle che copre l’occhio quando lo chiudo. Mi proteggono da urti, luce forte e polvere. Quando sbatto le palpebre, stendono le lacrime sulla superficie dell’occhio.");
A(0,"f",["g-congiuntiva"],"CONGIUNTIVA","Congiuntiva! È una pellicola sottile e delicata che riveste l’interno delle palpebre e una parte del bianco dell’occhio. Mi aiuta a tenere la superficie protetta e umida.");
A(0,"f",["g-lacrimale"],"APPARATO LACRIMALE","Apparato lacrimale! Produce le lacrime e le fa scorrere via. Le lacrime lavano, inumidiscono e proteggono l’occhio: sono una piccola pulizia naturale!");
A(1,"f",["g-tear"],"FILM LACRIMALE","Ora il segmento anteriore: la parte davanti dell’occhio, che fa entrare la luce. Film lacrimale! È un velo sottilissimo di lacrime che copre la superficie dell’occhio. Lo tiene pulito, umido e lucido.");
A(1,"f",["g-cornea","g-sclerafoto"],"CORNEA E SCLERA","Cornea e sclera! La cornea è la finestra trasparente davanti, da dove entra la luce. La sclera è il bianco dell’occhio: è resistente, protegge e dà la forma.");
A(1,"f",["g-iris"],"IRIDE E PUPILLA","Iride e pupilla! L’iride è la parte colorata. Al centro c’è la pupilla, il buchino nero: si stringe quando c’è tanta luce e si allarga quando ce n’è poca.");
A(1,"s",["s-chamber","s-cornea"],"CAMERA ANTERIORE","Camera anteriore! È lo spazio tra cornea e iride, pieno di un liquido trasparente che nutre le parti davanti e lascia passare la luce.");
A(1,"s",["s-lens"],"CRISTALLINO","Cristallino! È una lente trasparente dietro la pupilla. Cambia forma per mettere a fuoco ciò che guardo, da vicino e da lontano.");
A(1,"s",["s-zonula"],"ZONULA DI ZINN","Zonula di Zinn! Sono tantissimi fili sottilissimi che tengono il cristallino al suo posto, come le corde di un’altalena.");
A(1,"s",["s-ciliary"],"CORPI CILIARI","Corpi ciliari! Sono piccoli muscoli attorno al cristallino: lavorano insieme ai fili della zonula per aiutarlo a mettere a fuoco, e producono il liquido della camera anteriore.");
A(2,"s",["s-vitreous"],"CORPO VITREO","Adesso il segmento posteriore: la parte dietro il cristallino. Corpo vitreo! È una sostanza trasparente, simile a un gel, che riempie gran parte dell’interno dell’occhio. Lascia passare la luce e aiuta a tenere la retina al suo posto.");
A(2,"s",["s-retina"],"RETINA","Retina! È un sottile strato nella parte interna e posteriore dell’occhio, che riceve la luce. La trasforma in messaggi che arrivano al cervello attraverso il nervo ottico.");
A(2,"s",["s-macula"],"MACULA","Macula! È la zona centrale della retina che mi aiuta a vedere bene i dettagli. Mi serve per leggere, riconoscere i volti e vedere i particolari.");
A(2,"s",["s-fovea"],"FOVEA","Fovea! È una piccola zona al centro della macula, con tante cellule che aiutano a vedere i dettagli. Mi fa vedere con grande precisione ciò che guardo direttamente.");

A(2,"s",["s-photo"],"CONI E BASTONCELLI","Fotorecettori, cioè coni e bastoncelli! Sono cellule della retina che percepiscono la luce. I coni vedono colori e dettagli, i bastoncelli mi aiutano a vedere quando c’è poca luce.");

A(2,"s",["s-nerve"],"NERVO OTTICO","Disco ottico e nervo ottico! Il nervo è formato da tante fibre sottili che portano i messaggi della vista al cervello. Dove parte il nervo non si raccolgono immagini: è il punto cieco. Bravissimo, hai finito!");

let i=-1,auto=true,mute=false,tm,qa=null;
const voice=()=>(speechSynthesis.getVoices().find(v=>/^it/i.test(v.lang))||null);
let tok=0,stopped=false,lastT="";function say(t,cb){clearTimeout(tm);const my=++tok;lastT=t;const row=$("panel");const end=()=>{if(my!=tok)return;row.classList.remove("talking");cb&&cb()};

function nav(b){$("nav").innerHTML=b.map(x=>`<button class="${x[2]||""}" onclick="${x[1]}">${x[0]}</button>`).join("")}
function start(){$("row").style.display="";bub(`<h3>Ciao! Sono Occhietto 👋</h3>Ti porto a scoprire come è fatto l’occhio: annessi, segmento anteriore e posteriore. Alla fine di ogni parte c’è un quiz!`);$("dots").textContent="";$("chip").textContent="";nav([["▶ Comincia la lezione!","go(0)"]]);ref("f",[])}

 document.querySelectorAll(".ov").forEach(e=>{e.classList.remove("out")});document.querySelectorAll(".p").forEach(e=>e.classList.remove("on"));
 void O.getBoundingClientRect();$("o-in").innerHTML="";if(v=="s"){ids.forEach(id=>{const c=$(id).cloneNode(true);c.removeAttribute("id");c.removeAttribute("class");$("o-in").appendChild(c)});$("o-part").classList.add("out")}ids.forEach(id=>{const e=$(id);if(!e)return;e.classList.add(id.startsWith("s-")?"on":"out")})}
function go(n){stopped=false;if(n<0)n=0;if(n>=S.length){return quiz(2)}i=n;const p=S[n];ref(p.v,p.ids);$("chip").textContent=p.t;$("chip").style.animation="none";void $("chip").offsetWidth;$("chip").style.animation="";

 nav([["◀","go("+(n-1)+")","g"],["Avanti ▶","next()"],["⏹ Stop","st()","g stop"],[mute?"🔇":"🔊","tg('m')","g"],[auto?"Auto ✓":"Auto","tg('a')","g"]]);
 say(p.x,()=>{if(auto&&i===n)tm=setTimeout(next,1200)})}
function next(){const p=S[i],q=S[i+1];if(!q||q.grp!==p.grp)return quiz(p.grp);go(i+1)}
function st(){const b=document.querySelector("#nav .stop");if(!stopped){stopped=true;tok++;clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}$("panel").classList.remove("talking");if(b)b.textContent="▶ Riprendi"}else go(i)}
function qst(){const b=document.querySelector("#nav .stop");clearTimeout(tm);if(!stopped){stopped=true;tok++;try{speechSynthesis.cancel()}catch(e){}$("panel").classList.remove("talking");if(b)b.textContent="▶ Riprendi"}else{stopped=false;if(b)b.textContent="⏹ Stop";say(lastT)}}
function tg(k){if(k=="m"){mute=!mute;if(mute)speechSynthesis.cancel()}else{auto=!auto}go(i)}
function quiz(gi){clearTimeout(tm);speechSynthesis.cancel();$("chip").textContent="QUIZ!";ref("f",[]);qa={g:gi,n:0,sc:0};q1()}
function q1(){const[t,qs]=Q[qa.g],q=qs[qa.n];$("dots").textContent=`${t} · domanda ${qa.n+1} di ${qs.length}`;

function ans(k,b){const q=Q[qa.g][1][qa.n];document.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=1;if(j==q[2])x.classList.add("ok")});
 if(k==q[2]){qa.sc++;say("Bravo! "+q[3])}else{b.classList.add("ko");say("Quasi! "+q[3])}

function qn(){qa.n++;if(qa.n<Q[qa.g][1].length)return q1();const tot=Q[qa.g][1].length,st="⭐".repeat(qa.sc)+"☆".repeat(tot-qa.sc);
 const last=qa.g==2;bub(`<h3>Quiz finito!</h3><div class="big">${st}</div>Hai fatto ${qa.sc} su ${tot}. ${last?"Sei un vero esperto dell’occhio!":"Andiamo avanti con la lezione!"}`);
 say(`Hai fatto ${qa.sc} su ${tot}! ${last?"Sei un vero esperto dell’occhio!":"Andiamo avanti!"}`);
 nav(last?[["↻ Ricomincia","start()"]]:[["Continua ▶",`go(${S.findIndex(p=>p.grp==qa.g+1)})`]])}
